project:
  name: privileged_rgb_t_d_relation_distillation
  protocol_version: "2026-10-12"
  output_root: "."

reproducibility:
  seed: 20261012
  deterministic: true
  cudnn_benchmark: false

model:
  backbone: resnet50
  input_size: [352, 352]
  num_classes: 1

optimization:
  epochs: 100
  batch_size: 8
  num_workers: 4
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

loss:
  lambda_iou: 1.0
  lambda_logit: 1.0
  lambda_relation: 1.0
  lambda_boundary: 1.0
  lambda_uncertainty: 0.1
  lambda_prior: 0.05
  temperature: 4.0

logging:
  log_dir: logs
  checkpoint_dir: checkpoints
  result_csv: results/experiment_records.csv
  save_every_epochs: 10

